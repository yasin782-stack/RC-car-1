<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>RC Car Controller</title>

<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;

    background:#000;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =====================================================
   APP
===================================================== */

#app{
    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 35% 65%,
            #102015 0%,
            #050806 35%,
            #000 75%
        );

    transition:
        background .3s ease;
}

#app.sport{
    background:
        radial-gradient(
            ellipse at 35% 65%,
            #25100d 0%,
            #090303 35%,
            #000 75%
        );
}


/* =====================================================
   ROTATE MESSAGE
===================================================== */

#rotatePrompt{
    display:none;

    position:fixed;
    inset:0;

    background:#000;
    color:#fff;

    z-index:9999;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

    font-size:14px;
}

#rotatePrompt .rotateIcon{
    font-size:45px;
    margin-bottom:15px;
}

@media (orientation:portrait){

    #rotatePrompt{
        display:flex;
    }

    #app{
        display:none;
    }

}


/* =====================================================
   TOP STATUS
===================================================== */

#infoBar{

    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;

    gap:18px;

    padding:7px 16px;

    background:#080808e8;

    border:1px solid #292929;

    border-radius:12px;

    z-index:50;

    font-size:9px;

    white-space:nowrap;
}

.infoItem{

    display:flex;
    align-items:center;

    gap:5px;

    color:#aaa;
}

.dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#444;

}

.dot.ok{

    background:#4caf50;

    box-shadow:
        0 0 8px #4caf50;

}

.dot.bad{

    background:#f44336;

    box-shadow:
        0 0 8px #f44336;

}


/* =====================================================
   CONNECTION
===================================================== */

#statusBox{

    position:absolute;

    top:10px;
    right:12px;

    width:155px;

    padding:8px;

    background:#080808ee;

    border:1px solid #292929;

    border-radius:11px;

    z-index:60;

    text-align:center;
}

#status{

    font-size:9px;

    color:#aaa;

    margin-bottom:5px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

#connectBtn{

    width:100%;

    padding:7px;

    border:0;

    border-radius:6px;

    background:
        linear-gradient(
            #1684e8,
            #0756a7
        );

    color:#fff;

    font-size:9px;

    font-weight:bold;

}


/* =====================================================
   DISTANCE
===================================================== */

#distCircle{

    position:absolute;

    top:10px;
    left:12px;

    width:105px;
    height:105px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #111 40%,
            #050505 100%
        );

    border:2px solid #245f38;

    box-shadow:
        0 0 15px
        rgba(76,175,80,.12);

    z-index:40;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.distVal{

    font-size:16px;

    line-height:18px;

    font-weight:bold;
}

.distLabel{

    color:#777;

    font-size:6px;

    letter-spacing:1px;

    margin-bottom:2px;
}

#distFront{

    color:#4caf50;

}

#distRear{

    color:#29b6f6;

}

.distanceDanger{

    color:#f44336 !important;

}


/* =====================================================
   GPS COORDINATES
===================================================== */

#coords{

    position:absolute;

    top:48px;
    left:50%;

    transform:translateX(-50%);

    color:#777;

    font-size:8px;

    z-index:40;

    white-space:nowrap;
}


/* =====================================================
   MODE
===================================================== */

#modeToggle{

    position:absolute;

    top:78px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:4px;

    padding:4px;

    background:#111;

    border:1px solid #333;

    border-radius:9px;

    z-index:50;
}

.modeBtn{

    padding:6px 16px;

    border:0;

    border-radius:6px;

    background:#1a1a1a;

    color:#777;

    font-size:8px;

    font-weight:bold;
}

#ecoBtn.active{

    background:#218b32;

    color:#fff;

}

#sportBtn.active{

    background:#b51e1e;

    color:#fff;

}


/* =====================================================
   GPS / SMS
===================================================== */

#utilityButtons{

    position:absolute;

    left:12px;
    top:123px;

    display:flex;

    gap:5px;

    z-index:50;
}

.utilityBtn{

    padding:6px 9px;

    background:#111;

    border:1px solid #333;

    border-radius:6px;

    color:#aaa;

    font-size:7px;
}


/* =====================================================
   SMS PANEL
===================================================== */

#msgPanel{

    display:none;

    position:absolute;

    left:12px;
    top:158px;

    width:220px;

    padding:9px;

    background:#080808f5;

    border:1px solid #333;

    border-radius:9px;

    z-index:80;
}

#msgPanel.open{

    display:block;

}

#msgInput{

    width:100%;

    padding:8px;

    background:#111;

    border:1px solid #444;

    border-radius:6px;

    color:#fff;

    font-size:8px;

    outline:none;
}

#msgSendBtn{

    width:100%;

    margin-top:6px;

    padding:7px;

    border:0;

    border-radius:6px;

    background:#4caf50;

    color:#fff;

    font-size:8px;

    font-weight:bold;
}

#msgStatus{

    display:block;

    margin-top:5px;

    color:#777;

    font-size:7px;
}


/* =====================================================
   SPEED / RPM
===================================================== */

#gaugeRow{

    position:absolute;

    left:34%;

    top:45%;

    transform:
        translate(-50%,-50%);

    display:flex;

    gap:10px;

    z-index:10;
}

.gaugeWrap{

    position:relative;

    width:105px;
    height:105px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #121212 40%,
            #050505 75%,
            #000 100%
        );

    border:3px solid #292929;

    box-shadow:
        inset 0 0 12px #000,
        0 0 12px rgba(0,0,0,.7);
}

.gaugeWrap::before{

    content:"";

    position:absolute;

    inset:7px;

    border-radius:50%;

    border:1px solid #333;
}

.gaugeTitle{

    position:absolute;

    top:22px;

    width:100%;

    text-align:center;

    color:#777;

    font-size:7px;

    letter-spacing:1px;
}

.gaugeNum{

    position:absolute;

    top:38px;

    width:100%;

    text-align:center;

    font-size:21px;

    font-weight:bold;
}

.gaugeUnit{

    position:absolute;

    top:67px;

    width:100%;

    text-align:center;

    color:#777;

    font-size:6px;

    letter-spacing:1px;
}


/* =====================================================
   CAMERA
===================================================== */

#cameraPanel{

    position:absolute;

    right:165px;

    top:50%;

    transform:translateY(-50%);

    width:190px;

    padding:8px;

    background:#080808ed;

    border:1px solid #333;

    border-radius:11px;

    z-index:40;

    text-align:center;

    transition:
        border-color .2s,
        box-shadow .2s;
}

#driverCamera{

    display:block;

    width:100%;
    height:125px;

    object-fit:cover;

    border-radius:8px;

    background:#111;

    transform:scaleX(-1);
}

#cameraState,
#eyeState{

    margin-top:4px;

    color:#777;

    font-size:8px;

}

#drowsyState{

    margin-top:5px;

    padding:5px;

    border-radius:5px;

    background:#09200e;

    color:#4caf50;

    font-size:9px;

    font-weight:bold;

    transition:
        color .2s,
        background .2s,
        border .2s;
}

#cameraPanel.drowsy{

    border-color:#f44336;

    box-shadow:
        0 0 15px
        rgba(244,67,54,.3);
}

#cameraPanel.drowsy #drowsyState{

    color:#f44336;

    background:#300707;

    border:1px solid #f44336;

}

#cameraBtn{

    width:100%;

    margin-top:6px;

    padding:7px;

    border:0;

    border-radius:6px;

    background:#1684e8;

    color:#fff;

    font-size:8px;

    font-weight:bold;
}


/* =====================================================
   LEFT STEERING
===================================================== */

#steeringButtons{

    position:absolute;

    left:15px;

    bottom:25px;

    display:flex;

    gap:9px;

    z-index:60;
}

.steerBtn{

    width:68px;
    height:68px;

    border-radius:12px;

    background:
        linear-gradient(
            #3a3a3a,
            #202020
        );

    border:2px solid #29b6f6;

    color:#fff;

    font-size:9px;

    font-weight:bold;

    transition:
        transform .08s,
        background .08s;
}

.steerBtn:active{

    transform:scale(.94);

    background:#29b6f6;

    color:#000;
}


/* =====================================================
   RIGHT F / B
===================================================== */

#driveButtons{

    position:absolute;

    right:15px;

    bottom:25px;

    display:flex;

    flex-direction:column;

    gap:10px;

    z-index:60;
}

.driveBtn{

    width:68px;
    height:78px;

    border-radius:12px;

    background:
        linear-gradient(
            #555,
            #292929
        );

    border:2px solid #4caf50;

    color:#fff;

    font-size:9px;

    font-weight:bold;

    transition:
        transform .08s,
        background .08s;
}

#app.sport .driveBtn{

    border-color:#f44336;

}

.driveBtn:active{

    transform:scale(.94);

}

#app:not(.sport)
.driveBtn.active{

    background:#218b32;

}

#app.sport
.driveBtn.active{

    background:#b51e1e;

}


/* =====================================================
   OBSTACLE WARNING
===================================================== */

#obstacleWarning{

    position:absolute;

    left:50%;

    bottom:12px;

    transform:translateX(-50%);

    display:none;

    padding:6px 13px;

    background:#300707;

    border:1px solid #f44336;

    border-radius:7px;

    color:#f44336;

    font-size:8px;

    font-weight:bold;

    z-index:90;
}

#obstacleWarning.active{

    display:block;

}


/* =====================================================
   DROWSINESS OVERLAY
===================================================== */

#drowsyWarning{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:
        rgba(255,0,0,.08);

    border:
        5px solid
        rgba(244,67,54,.6);

    z-index:200;

    pointer-events:none;
}

#drowsyWarning.active{

    display:flex;

    animation:
        warningPulse 1.5s infinite;
}

#drowsyWarningText{

    color:#f44336;

    font-size:25px;

    font-weight:bold;

    text-shadow:
        0 0 15px red;
}

#drowsyWarningSub{

    margin-top:7px;

    color:#fff;

    font-size:10px;
}

@keyframes warningPulse{

    0%{
        border-color:
            rgba(244,67,54,.25);
    }

    50%{
        border-color:
            rgba(244,67,54,.9);
    }

    100%{
        border-color:
            rgba(244,67,54,.25);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    #infoBar{

        gap:8px;

        padding:6px 10px;

        font-size:7px;
    }

    #statusBox{

        width:125px;

    }

    #distCircle{

        width:90px;
        height:90px;

    }

    .distVal{

        font-size:14px;

    }

    #gaugeRow{

        left:30%;

        top:43%;

    }

    .gaugeWrap{

        width:82px;
        height:82px;

    }

    .gaugeTitle{

        top:17px;

        font-size:6px;

    }

    .gaugeNum{

        top:29px;

        font-size:17px;

    }

    .gaugeUnit{

        top:52px;

        font-size:5px;

    }

    #cameraPanel{

        right:92px;

        width:165px;

    }

    #driverCamera{

        height:105px;

    }

    .steerBtn{

        width:58px;
        height:58px;

    }

    .driveBtn{

        width:58px;
        height:70px;

    }

}


/* =====================================================
   VERY SMALL
===================================================== */

@media(max-width:650px){

    #cameraPanel{

        right:80px;

        width:145px;

    }

    #driverCamera{

        height:90px;

    }

    #gaugeRow{

        left:27%;

    }

    .gaugeWrap{

        width:72px;
        height:72px;

    }

    .gaugeTitle{

        top:15px;

    }

    .gaugeNum{

        top:26px;

        font-size:15px;

    }

    .gaugeUnit{

        top:46px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     ROTATE PROMPT
===================================================== -->

<div id="rotatePrompt">

    <div class="rotateIcon">
        &#8635;
    </div>

    <div>
        Please rotate your phone to landscape
        <br>
        to control the car
    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">


    <!-- =================================================
         TOP STATUS
    ================================================== -->

    <div id="infoBar">

        <div class="infoItem">

            <span
                id="bleDot"
                class="dot">
            </span>

            BLE

        </div>

        <div class="infoItem">

            <span
                id="gpsDot"
                class="dot">
            </span>

            GPS

        </div>

        <div class="infoItem">

            <span
                id="gsmDot"
                class="dot">
            </span>

            GSM

        </div>

        <div class="infoItem">

            <span
                id="smsDot"
                class="dot">
            </span>

            SMS

        </div>

    </div>


    <!-- =================================================
         CONNECTION
    ================================================== -->

    <div id="statusBox">

        <div id="status">
            Not connected
        </div>

    <div id="distCircle">

        </div>

    <div id="msgPanel">

<script>

/* =====================================================
   BLE UUID
===================================================== */

const SERVICE_UUID =
    '4fafc201-1fb5-459e-8fcc-c5c9c331914b';

const CMD_CHAR_UUID =
    'beb5483e-36e1-4688-b7f5-ea07361b26a8';

const TELE_CHAR_UUID =
    'beb5483e-36e1-4688-b7f5-ea07361b26a9';


/* =====================================================
   CONSTANTS
===================================================== */

const MAX_STEERING = 70;

const OBSTACLE_CM = 30;

const EYE_WARN_MS = 2000;

const EYE_ALERT_MS = 10000;


/* =====================================================
   BLE VARIABLES
===================================================== */

let bleDevice = null;

let bleServer = null;

let cmdChar = null;

let teleChar = null;


/* =====================================================
   CAMERA VARIABLES
===================================================== */

let cameraStream = null;

let faceMesh = null;

let cameraRunning = false;

let processingFrame = false;

let eyesClosedSince = 0;

let drowsyPhase = 'NORMAL';


/* =====================================================
   DOM
===================================================== */

const app =
    document.getElementById('app');

const statusEl =
    document.getElementById('status');

const connectBtn =
    document.getElementById('connectBtn');

const bleDot =
    document.getElementById('bleDot');

const gpsDot =
    document.getElementById('gpsDot');

const gsmDot =
    document.getElementById('gsmDot');

const smsDot =
    document.getElementById('smsDot');

const frontEl =
    document.getElementById('distFront');

const rearEl =
    document.getElementById('distRear');

const speedNum =
    document.getElementById('speedNum');

const rpmNum =
    document.getElementById('rpmNum');

const ecoBtn =
    document.getElementById('ecoBtn');

const sportBtn =
    document.getElementById('sportBtn');

const cameraPanel =
    document.getElementById('cameraPanel');

const driverCamera =
    document.getElementById('driverCamera');

const cameraState =
    document.getElementById('cameraState');

const eyeState =
    document.getElementById('eyeState');

const drowsyState =
    document.getElementById('drowsyState');

const cameraBtn =
    document.getElementById('cameraBtn');

const drowsyWarning =
    document.getElementById('drowsyWarning');

const obstacleWarning =
    document.getElementById('obstacleWarning');

const forwardBtn =
    document.getElementById('forwardBtn');

const reverseBtn =
    document.getElementById('reverseBtn');

const leftBtn =
    document.getElementById('leftBtn');

const rightBtn =
    document.getElementById('rightBtn');

const coords =
    document.getElementById('coords');

const gpsReqBtn =
    document.getElementById('gpsReqBtn');

const smsBtn =
    document.getElementById('smsBtn');

const msgPanel =
    document.getElementById('msgPanel');

const msgInput =
    document.getElementById('msgInput');

const msgSendBtn =
    document.getElementById('msgSendBtn');

const msgStatus =
    document.getElementById('msgStatus');


/* =====================================================
   BLE CONNECT
===================================================== */

connectBtn.addEventListener(
    'click',
    connectBLE
);


async function connectBLE(){

    if(!navigator.bluetooth){

        statusEl.textContent =
            'BLE NOT SUPPORTED';

        return;

    }

    try{

        statusEl.textContent =
            'REQUESTING DEVICE...';

        bleDevice =
            await navigator.bluetooth.requestDevice({

                filters:[
                    {
                        services:[
                            SERVICE_UUID
                        ]
                    }
                ]

            });


        bleDevice.addEventListener(
            'gattserverdisconnected',
            onDisconnected
        );


        statusEl.textContent =
            'CONNECTING...';


        bleServer =
            await bleDevice.gatt.connect();


        const service =
            await bleServer.getPrimaryService(
                SERVICE_UUID
            );


        cmdChar =
            await service.getCharacteristic(
                CMD_CHAR_UUID
            );


        teleChar =
            await service.getCharacteristic(
                TELE_CHAR_UUID
            );


        await teleChar.startNotifications();


        teleChar.addEventListener(

        );


        statusEl.textContent =
            'CONNECTED';


        bleDot.className =

    }catch(error){

}

/* =====================================================
   SEND BLE COMMAND
===================================================== */

async function sendCmd(command){

    if(!cmdChar){

        return false;

    }


    try{

        const data =
            new TextEncoder()
            .encode(command);


        if(
            cmdChar.properties &&
            cmdChar.properties.write
        ){

            await cmdChar.writeValue(
                data
            );

            return true;

        }


        if(
            cmdChar.properties &&
            cmdChar.properties.writeWithoutResponse
        ){

            await cmdChar.writeValueWithoutResponse(
                data
            );

            return true;

        }

    }catch(error){

        console.error(
            'BLE COMMAND:',
            error
        );

    }


    return false;

}


/* =====================================================
   TELEMETRY
===================================================== */

function onTelemetry(event){

    const value =
        new TextDecoder()
        .decode(
            event.target.value
        );


    console.log(
        'TELEMETRY:',
        value
    );


    const distanceMatch =
        value.match(
            /F:(-?\d+),R:(-?\d+)/
        );


    if(distanceMatch){

        const front =
            Number(
                distanceMatch[1]
            );

        const rear =
            Number(
                distanceMatch[2]
            );


        if(Number.isFinite(front)){

            frontEl.textContent =
                front;

            frontEl.classList.toggle(
                'distanceDanger',
                front > 0 &&
                front <= OBSTACLE_CM
            );

        }


        if(Number.isFinite(rear)){

            rearEl.textContent =
                rear;

            rearEl.classList.toggle(
                'distanceDanger',
                rear > 0 &&
                rear <= OBSTACLE_CM
            );

        }


        checkObstacle(
            front,
            rear
        );

    }


    /* GPS */

    const gpsMatch =
        value.match(
            /GPS:(\d)/
        );

    const latMatch =
        value.match(
            /LAT:(-?\d+\.\d+)/
        );

    const lonMatch =
        value.match(
            /LON:(-?\d+\.\d+)/
        );


    if(gpsMatch){

        const hasFix =
            gpsMatch[1] === '1';


        gpsDot.className =
            hasFix
            ? 'dot ok'
            : 'dot bad';


        if(
            hasFix &&
            latMatch &&
            lonMatch
        ){

            coords.textContent =
                latMatch[1] +
                ', ' +
                lonMatch[1];

        }else{

            coords.textContent =
                'NO GPS FIX';

        }

    }


    /* GSM */

    const gsmMatch =
        value.match(
            /GSM:(\d)/
        );


    if(gsmMatch){

        gsmDot.className =
            gsmMatch[1] === '1'
            ? 'dot ok'
            : 'dot bad';

    }


    /* SMS */

    const smsMatch =
        value.match(
            /SMS:(\d)/
        );


    if(smsMatch){

        smsDot.className =
            smsMatch[1] === '1'
            ? 'dot ok'
            : 'dot';

    }

}


/* =====================================================
   30 CM OBSTACLE SAFETY
===================================================== */

function checkObstacle(
    front,
    rear
){

    const movingForward =
        forwardBtn.classList.contains(
            'active'
        );


    const movingReverse =
        reverseBtn.classList.contains(
            'active'
        );


    const frontDanger =
        Number.isFinite(front) &&
        front > 0 &&
        front <= OBSTACLE_CM;


    const rearDanger =
        Number.isFinite(rear) &&
        rear > 0 &&
        rear <= OBSTACLE_CM;


    if(
        (movingForward && frontDanger) ||
        (movingReverse && rearDanger)
    ){

        obstacleWarning.classList.add(
            'active'
        );


        forwardBtn.classList.remove(
            'active'
        );

        reverseBtn.classList.remove(
            'active'
        );


        speedNum.textContent =
            '0';

        rpmNum.textContent =
            '0';


        sendCmd('S');

    }else{

        obstacleWarning.classList.remove(
            'active'
        );

    }

}

async function startCamera(){

        if(cameraStream){

            cameraStream
                .getTracks()
                .forEach(
                    track=>{
                        track.stop();
                    }
                );

        }


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:'user'
                    },

                    audio:false

                });


        driverCamera.srcObject =
            cameraStream;


        cameraState.textContent =
            'CAMERA ACTIVE';


        cameraBtn.textContent =
            'CAMERA ON';


        cameraRunning =
            true;


        await setupFaceMesh();


    }catch(error){

        cameraState.textContent =
            'CAMERA ERROR';

    }

}

/* =====================================================
   FACE MESH
===================================================== */

async function setupFaceMesh(){

    if(faceMesh){
        return;
    }


    if(
        typeof FaceMesh ===
        'undefined'
    ){

        eyeState.textContent =
            'AI NOT LOADED';

        return;

    }


    faceMesh =
        new FaceMesh({

            locateFile:
                file =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

        });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:
            0.5,

        minTrackingConfidence:
            0.5

    });


    faceMesh.onResults(
        handleFaceResults
    );


    processCameraFrame();

}


/* =====================================================
   CAMERA FRAME LOOP
===================================================== */

async function processCameraFrame(){

    if(!cameraRunning){
        return;
    }


    if(
        faceMesh &&
        !processingFrame &&
        driverCamera.readyState >= 2
    ){

        processingFrame =
            true;


        try{

            await faceMesh.send({

                image:
                    driverCamera

            });

        }catch(error){

            console.error(
                'FACE MESH ERROR:',
                error
            );

        }


        processingFrame =
            false;

    }


    requestAnimationFrame(
        processCameraFrame
    );

}

            if(

            ){

            }


            try{

                if(bleStatus){

                bleDevice
                .addEventListener(

                    .gatt
                    .connect();


                const service =
                    await
                    server
                    .getPrimaryService(
                        SERVICE_UUID
                    );


                cmdCharacteristic =
                    await
                    service
                    .getCharacteristic(
                        CMD_UUID
                    );


                try{

/* =================================================
   EYE STATE PROCESSING
================================================= */

function processEyeState(
    eyesClosed
){

    if(
        eyesClosed
    ){

        eyeState.textContent =
            "EYES: CLOSED";


        if(
            eyesClosedSince === 0
        ){

            eyesClosedSince =
                Date.now();

        }


        const elapsed =
            Date.now() -
            eyesClosedSince;


        /* =============================================
           10 SECOND ALERT
        ============================================= */

        if(
            elapsed >= EYE_ALERT_MS
        ){

            if(
                drowsyPhase !== "ALERT"
            ){

                drowsyPhase =
                    "ALERT";


                setDrowsyUI();


                sendCmd(
                    "EYE:ALERT"
                );


                stopCarUI();

            }


            return;

        }


        /* =============================================
           2 SECOND WARNING
        ============================================= */

        if(
            elapsed >= EYE_WARN_MS
        ){

            if(
                drowsyPhase === "NORMAL"
            ){

                drowsyPhase =
                    "WARN";


                setDrowsyUI();


                sendCmd(
                    "EYE:WARN"
                );


                stopCarUI();

            }

        }

    }else{

        eyeState.textContent =
            "EYES: OPEN";


        eyesClosedSince =
            0;


        if(
            drowsyPhase !== "NORMAL"
        ){

            drowsyPhase =
                "NORMAL";


            clearDrowsyUI();


            sendCmd(
                "EYE:CLEAR"
            );

        }

    }

}

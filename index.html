<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>RC Car Controller</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at 30% 60%,#0a1f14 0%,#000 55%),
    radial-gradient(circle at 70% 60%,#0a1522 0%,#000 55%);
}


/* ================================
   BLE
================================ */

#statusBox{
    position:absolute;
    top:8px;
    right:10px;
    z-index:30;
    text-align:right;
}

#status{
    font-size:9px;
    color:#aaa;
    margin-bottom:4px;
    max-width:180px;
}

#connectBtn{
    padding:7px 12px;
    font-size:10px;
    border:0;
    border-radius:9px;
    background:#2196F3;
    color:#fff;
}


/* ================================
   DISTANCE
================================ */

#distCircle{
    position:absolute;
    top:8px;
    left:10px;

    width:72px;
    height:72px;

    border-radius:50%;
    border:2px solid #333;

    background:#111;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:20;
}

.distVal{
    font-size:12px;
    font-weight:bold;
    line-height:13px;
}

.distLabel{
    font-size:6px;
    color:#777;
    margin-bottom:2px;
}

#distFront{
    color:#4CAF50;
}

#distRear{
    color:#29b6f6;
}


/* ================================
   MODE
================================ */

#modeToggle{
    position:absolute;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:3px;

    background:#111;
    border:1px solid #333;

    padding:3px;
    border-radius:8px;

    z-index:30;
}

.modeBtn{
    padding:5px 10px;
    font-size:9px;

    border:0;
    border-radius:6px;

    background:#222;
    color:#888;
}

.modeBtn.active{
    background:#4CAF50;
    color:#fff;
}


/* ================================
   GAUGES
================================ */

#gaugeRow{
    position:absolute;

    top:46%;
    left:50%;

    transform:translate(-50%,-50%);

    display:flex;

    gap:18px;

    z-index:5;
}

.gauge{
    position:relative;

    width:145px;
    height:145px;

    border-radius:50%;

    border:6px solid #333;

    background:#111;

    box-shadow:
        0 0 15px #111;
}

.gaugeTitle{
    position:absolute;

    top:37px;

    width:100%;

    text-align:center;

    color:#888;

    font-size:10px;

    letter-spacing:2px;
}

.gaugeNumber{
    position:absolute;

    top:57px;

    width:100%;

    text-align:center;

    font-size:32px;

    font-weight:bold;
}

.gaugeUnit{
    position:absolute;

    top:99px;

    width:100%;

    text-align:center;

    color:#888;

    font-size:8px;
}


/* ================================
   STEERING
================================ */

#wheelWrap{
    position:absolute;

    left:18px;
    bottom:18px;

    width:135px;
    height:135px;

    z-index:20;
}

#wheel{
    width:100%;
    height:100%;

    border-radius:50%;

    border:7px solid #555;

    background:#151515;

    position:relative;

    transition:
        transform .15s ease;
}

#wheel:before{
    content:"";

    position:absolute;

    left:50%;
    top:15%;

    width:9px;
    height:70%;

    transform:translateX(-50%);

    background:#333;
}

#wheel:after{
    content:"";

    position:absolute;

    top:50%;
    left:15%;

    width:70%;
    height:9px;

    transform:translateY(-50%);

    background:#333;
}

#hub{
    position:absolute;

    left:50%;
    top:50%;

    width:42px;
    height:42px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#222;

    border:3px solid #777;
}


/* ================================
   PEDALS
================================ */

#pedalStack{
    position:absolute;

    right:18px;
    bottom:18px;

    display:flex;

    flex-direction:column;

    gap:10px;

    z-index:20;
}

.pedal{
    width:52px;
    height:82px;

    border-radius:10px;

    background:
        linear-gradient(
            #c8c8c8,
            #555
        );

    color:#111;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding-top:8px;

    font-size:9px;

    font-weight:bold;

    box-shadow:
        0 3px 7px #000;
}

.pedal.active{
    box-shadow:
        0 0 16px #4CAF50;
}


/* ================================
   CAMERA
================================ */

#cameraPanel{
    position:absolute;

    right:82px;
    bottom:18px;

    width:125px;

    padding:5px;

    background:#000e;

    border:1px solid #444;

    border-radius:9px;

    z-index:25;

    text-align:center;
}

#driverCamera{
    width:100%;
    height:70px;

    object-fit:cover;

    border-radius:6px;

    background:#111;

    display:block;

    transform:scaleX(-1);
}

#cameraState{
    font-size:7px;

    color:#aaa;

    margin-top:3px;
}

#cameraBtn,
#switchCamera{
    width:100%;

    margin-top:4px;

    padding:5px;

    font-size:7px;

    border:0;

    border-radius:6px;

    background:#2196F3;

    color:white;
}

#switchCamera{
    background:#444;
}


/* ================================
   SMALL PHONE SCREEN
================================ */

@media(max-width:700px){

    #gaugeRow{
        top:43%;

        transform:
            translate(-50%,-50%)
            scale(.85);

        gap:8px;
    }

    #wheelWrap{
        width:125px;
        height:125px;

        left:12px;
        bottom:12px;
    }

    #pedalStack{
        right:12px;
        bottom:12px;
    }

    .pedal{
        width:48px;
        height:76px;
    }

    #cameraPanel{
        right:68px;
        bottom:12px;

        width:115px;
    }

    #driverCamera{
        height:64px;
    }

}


/* ================================
   VERY SMALL SCREEN
================================ */

@media(max-width:500px){

    #gaugeRow{
        transform:
            translate(-50%,-50%)
            scale(.70);
    }

    #wheelWrap{
        width:105px;
        height:105px;
    }

    #cameraPanel{
        right:62px;
        width:100px;
    }

    #driverCamera{
        height:56px;
    }

    .pedal{
        width:43px;
        height:68px;
    }

}

</style>
</head>


<body>

<div id="app">


<!-- DISTANCE -->

<div id="distCircle">

    <div class="distVal">
        <span id="distFront">--</span>
    </div>

    <div class="distLabel">
        FRONT CM
    </div>

    <div class="distVal">
        <span id="distRear">--</span>
    </div>

    <div class="distLabel">
        REAR CM
    </div>

</div>


<!-- BLE -->

<div id="statusBox">

    <div id="status">
        Not connected
    </div>

    <button id="connectBtn">
        Connect to Car
    </button>

</div>


<!-- MODE -->

<div id="modeToggle">

    <button
        class="modeBtn active"
        id="ecoBtn">
        ECO
    </button>

    <button
        class="modeBtn"
        id="sportBtn">
        SPORT
    </button>

</div>


<!-- GAUGES -->

<div id="gaugeRow">

    <div class="gauge">

        <div class="gaugeTitle">
            SPEED
        </div>

        <div
            class="gaugeNumber"
            id="speedNum">
            0
        </div>

        <div class="gaugeUnit">
            KM/H
        </div>

    </div>


    <div class="gauge">

        <div class="gaugeTitle">
            RPM
        </div>

        <div
            class="gaugeNumber"
            id="rpmNum">
            0
        </div>

        <div class="gaugeUnit">
            RPM
        </div>

    </div>

</div>


<!-- STEERING -->

<div id="wheelWrap">

    <div id="wheel">

        <div id="hub"></div>

    </div>

</div>


<!-- PEDALS -->

<div id="pedalStack">

    <div
        class="pedal"
        id="fwdBtn">
        FWD
    </div>

    <div
        class="pedal"
        id="backBtn">
        BACK
    </div>

</div>


<!-- CAMERA -->

<div id="cameraPanel">

    <video
        id="driverCamera"
        autoplay
        playsinline
        muted>
    </video>

    <div id="cameraState">
        CAMERA OFF
    </div>

    <button id="cameraBtn">
        START CAMERA
    </button>

    <button id="switchCamera">
        SWITCH
    </button>

</div>


</div>


<script src="script.js"></script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RC Car Controller</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
</head>
<body>
  <main id="app" aria-label="RC car dashboard">
    <header class="topbar">
      <section class="distance-strip panel" aria-label="Vehicle distances">
        <div id="frontCard" class="distance-card front"><span>FRONT CM</span><strong id="distFront">--</strong></div>
        <div class="distance-divider"></div>
        <div id="rearCard" class="distance-card rear"><span>REAR CM</span><strong id="distRear">--</strong></div>
      </section>
      <section class="vehicle-status panel" aria-label="Vehicle status">
        <div class="status-item"><span class="status-label"><i class="indicator gps-indicator"></i>GPS</span><strong id="gpsStatus">NO FIX</strong><small id="coords">--, --</small></div>
        <div class="status-item"><span class="status-label"><i class="indicator gsm-indicator"></i>GSM</span><strong id="gsmStatus">UNKNOWN</strong></div>
        <div class="status-item"><span class="status-label"><i class="indicator sms-indicator"></i>SMS</span><strong id="smsStatus">READY</strong></div>
      </section>
      <section class="connection-card panel" aria-label="Bluetooth connection">
        <div class="connection-state"><span id="bleDot" class="status-dot"></span><span id="status">Not connected</span></div>
        <div class="ble-state"><span>BLE</span><strong id="bleStatus">DISCONNECTED</strong></div>
        <button id="connectBtn" type="button">CONNECT TO CAR</button>
      </section>
    </header>

    <section class="message-panel panel" aria-label="Messaging and location tools">
      <button id="gpsReqBtn" type="button">REQUEST GPS</button>
      <input id="msgInput" type="text" maxlength="120" placeholder="SMS message" aria-label="SMS message">
      <button id="msgSendBtn" type="button">SEND SMS</button><span id="msgStatus">STATUS: READY</span>
    </section>

    <section class="dashboard-layout" aria-label="Driving dashboard">
      <section id="drivePanel" class="panel drive-panel">
        <div class="mode-row" aria-label="Driving mode"><button id="ecoBtn" class="mode-btn active" type="button">ECO</button><button id="sportBtn" class="mode-btn" type="button">SPORT</button></div>
        <div class="gauge-row">
          <div id="speedGauge" class="gauge speed-gauge"><div class="gauge-face"><span class="gauge-title">SPEED</span><strong id="speedNum">0</strong><small>KM/H</small></div></div>
          <div id="rpmGauge" class="gauge rpm-gauge"><div class="gauge-face"><span class="gauge-title">RPM</span><strong id="rpmNum">0</strong><small>RPM</small></div></div>
        </div>
        <div id="obstacleWarning" class="warning" role="alert">⚠ OBSTACLE DETECTED — VEHICLE STOPPED</div>
      </section>

      <section id="cameraPanel" class="panel camera-panel">
        <div class="camera-heading"><h2>DRIVER CAMERA</h2><span id="cameraState">CAMERA OFF</span></div>
        <video id="driverCamera" autoplay playsinline muted></video>
        <div class="camera-readout"><span id="eyeState">EYES: --</span><strong id="drowsyState" class="driver-normal">DRIVER NORMAL</strong></div>
        <button id="cameraBtn" type="button">START CAMERA</button>
      </section>

      <section class="controls-panel panel" aria-label="Driving controls">
        <div id="steeringButtons" class="control-group steering-controls"><span>STEER</span><div>
          <button id="leftBtn" class="control-btn steer" type="button">◀<small>LEFT</small></button><button id="rightBtn" class="control-btn steer" type="button">▶<small>RIGHT</small></button>
        </div></div>
        <div id="driveButtons" class="control-group drive-controls"><span>GEAR</span>
          <div class="gear-selector" role="group" aria-label="Select direction"><button id="gearFwdBtn" class="gear-btn active" type="button" aria-pressed="true">FWD</button><button id="gearRevBtn" class="gear-btn" type="button" aria-pressed="false">REV</button></div>
          <button id="moveBtn" class="control-btn drive move-control" type="button">▲<small id="moveLabel">HOLD TO MOVE</small></button>
          <button id="stopBtn" class="control-btn stop-control" type="button">■<small>STOP</small></button>
        </div>
      </section>
    </section>
  </main>
  <div id="drowsyWarning" class="drowsy-warning" role="alert"><div><strong>⚠ SLEEPY DRIVER</strong><span>VEHICLE STOPPED — STAY ALERT</span></div></div>
  <script src="script.js?v=5"></script>
</body>
</html>
